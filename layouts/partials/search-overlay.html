<div id="search-overlay" class="search-overlay" hidden role="dialog" aria-modal="true" aria-label="Search posts">
  <div class="search-overlay__backdrop" data-search-close></div>
  <div class="search-overlay__panel" role="document">
    <div class="search-overlay__head">
      <span class="search-overlay__icon" aria-hidden="true">&#x2315;</span>
      <input
        id="search-overlay-input"
        class="search-overlay__input"
        type="search"
        placeholder="Search posts&hellip;"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Search posts"
      >
      <button class="search-overlay__close" type="button" data-search-close aria-label="Close search">
        <kbd>esc</kbd>
      </button>
    </div>
    <p id="search-overlay-status" class="search-overlay__status" role="status" aria-live="polite"></p>
    <ul id="search-overlay-results" class="search-overlay__results" aria-label="Search results"></ul>
  </div>
</div>
<script src="/js/search.js" defer></script>
